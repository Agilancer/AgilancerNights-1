<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Agilancer Nights</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div id="screen">
      <canvas id="game"></canvas>
    </div>

    <!-- Touch controls, overlaid on the game and see-through. -->
    <div id="controls">
      <div id="system">
        <div id="pause" class="btn small" data-action="pause"><span>&#10074;&#10074;</span></div>
        <div id="menu-btn" class="btn small" data-action="menu"><span>MENU</span></div>
      </div>

      <div id="dpad">
        <div class="arm up"></div>
        <div class="arm down"></div>
        <div class="arm left"></div>
        <div class="arm right"></div>
        <div class="hub"></div>
      </div>

      <div id="actions">
        <div id="btn-magic" class="btn" data-action="magic"><span>MAGIC</span></div>
        <div id="btn-attack" class="btn" data-action="attack"><span>ATK</span></div>
        <div id="btn-jump" class="btn" data-action="jump"><span>JUMP</span></div>
      </div>
    </div>

    <div id="menu" class="hidden" role="dialog" aria-label="Menu">
      <div class="menu-panel">
        <header class="menu-head">
          <nav class="tabs">
            <button class="tab on" type="button" data-tab="equip">Equip</button>
            <button class="tab" type="button" data-tab="items">Items</button>
            <button class="tab" type="button" data-tab="relics">Relics</button>
            <button class="tab" type="button" data-tab="map">Map</button>
          </nav>
          <div class="menu-stats"></div>
          <button id="menu-close" type="button" aria-label="Close">&#10005;</button>
        </header>

        <section class="page" data-page="equip">
          <div class="menu-col menu-scroll"><div class="menu-slots"></div></div>
          <div class="menu-col menu-right">
            <h2 class="equip-title"></h2>
            <ul class="menu-scroll list equip-list"></ul>
            <div class="menu-detail"></div>
          </div>
        </section>

        <section class="page hidden" data-page="items">
          <div class="menu-col menu-right wide">
            <div class="item-filters"></div>
            <ul class="menu-scroll list item-list"></ul>
            <div class="item-count-total"></div>
          </div>
          <div class="menu-col menu-right"><div class="menu-detail tall"></div></div>
        </section>

        <section class="page hidden" data-page="relics">
          <div class="menu-col menu-scroll full">
            <div class="relic-grid"></div>
            <p class="relic-count"></p>
            <button id="menu-quit" type="button">Quit to Title</button>
          </div>
        </section>

        <section class="page hidden" data-page="map">
          <div class="menu-col full map-wrap">
            <canvas id="map-canvas"></canvas>
            <div class="map-tools">
              <button id="map-in" type="button">+</button>
              <button id="map-out" type="button">&minus;</button>
              <button id="map-here" type="button">&#9678;</button>
            </div>
          </div>
        </section>
      </div>
    </div>

    <div id="title-menu" class="hidden">
      <button id="title-continue" type="button">Continue</button>
      <button id="title-new" type="button">New Game</button>
      <p class="title-hint">Best played full screen: Share &rarr; Add to Home Screen.</p>
    </div>

    <div id="rotate">Please rotate your device to landscape.</div>
    <div id="safe"></div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
