<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Agilancer Nights</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div id="screen">
      <canvas id="game"></canvas>
    </div>

    <div id="controls">
      <div id="pause" class="btn small" data-action="pause"><span>&#10074;&#10074;</span></div>

      <div id="dpad">
        <div class="arm up"></div>
        <div class="arm down"></div>
        <div class="arm left"></div>
        <div class="arm right"></div>
        <div class="hub"></div>
      </div>

      <div id="actions">
        <div id="btn-magic" class="btn" data-action="magic"><span>MAGIC</span></div>
        <div id="btn-attack" class="btn" data-action="attack"><span>ATK</span></div>
        <div id="btn-jump" class="btn" data-action="jump"><span>JUMP</span></div>
      </div>
    </div>

    <div id="rotate">Please rotate your device to portrait.</div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
